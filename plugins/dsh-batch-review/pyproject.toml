[project]
name = "dsh-batch-review"
version = "0.1.3"
description = "Git 交付本批审码旁路（WorkBuddy 裁剪；LLM 经公司网关 / 非官网 base_url）"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
]

[project.scripts]
dsh-batch-review = "dsh_batch_review.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

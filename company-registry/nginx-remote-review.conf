# 远端审码 Webhook —— 独立 location，不改动 /dsh-plugins/ 与其它站点
# 部署到: /www/server/panel/vhost/nginx/extension/175.178.238.31/remote-review.conf
# 然后: nginx -t && nginx -s reload
#
# 公网 Payload URL:
#   http://175.178.238.31/remote-review/webhook

location ^~ /remote-review/ {
    proxy_pass http://127.0.0.1:18787/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Gitlab-Token $http_x_gitlab_token;
    proxy_set_header X-Remote-Review-Secret $http_x_remote_review_secret;
    proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
    proxy_set_header X-GitHub-Event $http_x_github_event;
    proxy_set_header X-Gitlab-Event $http_x_gitlab_event;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    client_max_body_size 2m;
}

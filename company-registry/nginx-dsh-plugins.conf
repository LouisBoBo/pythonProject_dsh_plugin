# DSH 公司插件市场静态目录 + 私有 npm
# 部署到: /www/server/panel/vhost/nginx/extension/175.178.238.31/dsh-plugins.conf
# 然后: nginx -t && nginx -s reload
#
# 注意: 站点全局 index 含 index.php。若把 alias 直接指到 index.json 文件，
# nginx 会再拼 index.php → 出现 index.jsonindex.php → 500。
# 因此包目录 URL 用 rewrite 转到 .../index.json。

location ^~ /dsh-plugins/npm/ {
    alias /www/wwwroot/dsh-plugins/npm/;
    autoindex off;
    rewrite ^/dsh-plugins/npm/(@[^/]+/[^/]+)/?$ /dsh-plugins/npm/$1/index.json last;

    location ~* \.json$ {
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
    }
    add_header Access-Control-Allow-Origin * always;
    add_header Cache-Control "public, max-age=60";
}

location ^~ /dsh-plugins/ {
    alias /www/wwwroot/dsh-plugins/;
    autoindex off;
    add_header Access-Control-Allow-Origin * always;
    add_header Cache-Control "public, max-age=60";

    location ~* \.json$ {
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
    }
}
